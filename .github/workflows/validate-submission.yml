name: Validate submission

on:
  pull_request:
    paths:
      - "submissions/**"
      - ".github/scripts/validate_submission.py"
      - "code-bot/python/bot.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect submission folders changed
        id: detect
        run: |
          # Find unique submissions/<username>/ paths touched by this PR.
          # If only the validator script or the canonical starter changed,
          # we still need to validate the ci-fixture (which mirrors the
          # starter) to catch drift between the two.
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'submissions/' \
            | awk -F/ 'NF>=2 && $1=="submissions" {print $2}' \
            | sort -u)

          # Always include the fixture if validator or canonical starter changed
          NEEDS_FIXTURE=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            '.github/scripts/validate_submission.py' 'code-bot/python/bot.py' \
            | head -n 1)
          if [ -n "$NEEDS_FIXTURE" ]; then
            CHANGED=$(printf "%s\nci-fixture\n" "$CHANGED" | sort -u | sed '/^$/d')
          fi

          if [ -z "$CHANGED" ]; then
            echo "No submission folders changed."
            echo "folders=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Folders to validate:"
          echo "$CHANGED"
          echo "folders<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.folders != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install starter requirements
        if: steps.detect.outputs.folders != ''
        run: |
          # The validator's smoke test imports the bot, so its deps must
          # be installed in the CI environment.
          pip install -r code-bot/python/requirements.txt

      - name: Run validator
        if: steps.detect.outputs.folders != ''
        run: |
          set -euo pipefail
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            echo "::group::Validating submissions/$folder"
            python .github/scripts/validate_submission.py "submissions/$folder"
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.folders }}"
