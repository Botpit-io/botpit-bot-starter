name: Validate submission

on:
  pull_request:
    paths:
      - "submissions/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect submission folders changed
        id: detect
        run: |
          # Find unique submissions/<username>/ paths touched by this PR
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'submissions/' \
            | awk -F/ 'NF>=2 && $1=="submissions" {print $2}' \
            | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "No submission folders changed."
            echo "folders=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed submission folders:"
          echo "$CHANGED"
          echo "folders<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.folders != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validator
        if: steps.detect.outputs.folders != ''
        run: |
          set -euo pipefail
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            echo "::group::Validating submissions/$folder"
            python .github/scripts/validate_submission.py "submissions/$folder"
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.folders }}"
